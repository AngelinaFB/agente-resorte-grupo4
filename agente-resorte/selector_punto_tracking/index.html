<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        color: #e6e9ef;
        font-family: sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        max-width: 760px;
        height: auto;
        cursor: crosshair;
      }
      .hint {
        margin: 0 0 6px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <p id="hint" class="hint"></p>
    <canvas id="frame"></canvas>
    <script>
      const canvas = document.getElementById("frame");
      const context = canvas.getContext("2d");
      const image = new Image();
      let args = null;
      let selectedPoint = null;
      let selectedPoints = [];

      function send(type, data) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type }, data),
          "*"
        );
      }

      function draw() {
        if (!args || !image.complete || !image.naturalWidth) return;
        const displayWidth = args.display_width ?? 760;
        canvas.style.maxWidth =
          typeof displayWidth === "number" ? `${displayWidth}px` : displayWidth;
        document.getElementById("hint").textContent =
          args.selection_mode === "two_points"
            ? "Hacé clic en los dos extremos del tramo conocido de la regla."
            : "Hacé clic sobre el punto de la masa.";
        canvas.width = args.image_width;
        canvas.height = args.image_height;
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        if (args.selection_mode === "two_points") {
          if (selectedPoints.length === 2) {
            context.beginPath();
            context.moveTo(selectedPoints[0].x, selectedPoints[0].y);
            context.lineTo(selectedPoints[1].x, selectedPoints[1].y);
            context.strokeStyle = "#00ff66";
            context.lineWidth = Math.max(2, canvas.width / 400);
            context.stroke();
          }
          selectedPoints.forEach((point, index) => {
            context.beginPath();
            context.arc(point.x, point.y, 12, 0, 2 * Math.PI);
            context.fillStyle = "#00ff66";
            context.fill();
            context.fillStyle = "#062b15";
            context.font = `bold ${Math.max(14, canvas.width / 70)}px sans-serif`;
            context.textAlign = "center";
            context.textBaseline = "middle";
            context.fillText(String(index + 1), point.x, point.y);
          });
        } else if (selectedPoint) {
          context.beginPath();
          context.arc(selectedPoint.x, selectedPoint.y, 10, 0, 2 * Math.PI);
          context.strokeStyle = "#00ff66";
          context.lineWidth = Math.max(2, canvas.width / 400);
          context.stroke();
          context.beginPath();
          context.moveTo(selectedPoint.x - 15, selectedPoint.y);
          context.lineTo(selectedPoint.x + 15, selectedPoint.y);
          context.moveTo(selectedPoint.x, selectedPoint.y - 15);
          context.lineTo(selectedPoint.x, selectedPoint.y + 15);
          context.stroke();
        }
        send("streamlit:setFrameHeight", { height: canvas.clientHeight + 30 });
      }

      image.onload = draw;
      canvas.addEventListener("click", (event) => {
        if (!args) return;
        const bounds = canvas.getBoundingClientRect();
        const point = {
          x: Math.max(
            0,
            Math.min(
              args.image_width - 1,
              Math.round((event.clientX - bounds.left) * args.image_width / bounds.width)
            )
          ),
          y: Math.max(
            0,
            Math.min(
              args.image_height - 1,
              Math.round((event.clientY - bounds.top) * args.image_height / bounds.height)
            )
          ),
        };
        if (args.selection_mode === "two_points") {
          if (selectedPoints.length >= 2) selectedPoints = [];
          selectedPoints.push(point);
        } else {
          selectedPoint = point;
        }
        draw();
        send("streamlit:setComponentValue", {
          value: args.selection_mode === "two_points" ? selectedPoints : selectedPoint,
          dataType: "json",
        });
      });

      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "streamlit:render") return;
        args = event.data.args;
        selectedPoint = args.selected_point || null;
        selectedPoints = Array.isArray(args.selected_points) ? args.selected_points : [];
        if (image.src !== args.image_data) image.src = args.image_data;
        else draw();
      });

      send("streamlit:componentReady", { apiVersion: 1 });
      send("streamlit:setFrameHeight", { height: 360 });
    </script>
  </body>
</html>
